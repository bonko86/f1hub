services:
  f1:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/f1.sqlite
      JOLPICA_BASE_URL: ${JOLPICA_BASE_URL:-https://api.jolpi.ca/ergast/f1/}
      CALENDAR_INTERVAL_MINUTES: ${CALENDAR_INTERVAL_MINUTES:-720}
      STANDINGS_INTERVAL_MINUTES: ${STANDINGS_INTERVAL_MINUTES:-360}
      WEEKEND_INTERVAL_MINUTES: ${WEEKEND_INTERVAL_MINUTES:-30}
      RESULTS_INTERVAL_MINUTES: ${RESULTS_INTERVAL_MINUTES:-5}
    volumes:
      - f1_data:/app/data
      - f1_backups:/app/backups
    expose:
      - "3000"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
volumes:
  f1_data:
  f1_backups:
